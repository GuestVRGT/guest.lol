<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guest.lol</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap');
  :root {
    --bg1: #16082a; --bg2: #0c0418; --purple: #c084fc; --purple-bright: #f3e8ff;
    --purple-deep: #7c3aed; --pink: #f0abfc; --text: #faf5ff; --muted: #b8a0d4;
    --glass-border: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif; color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px;
    background:
      radial-gradient(ellipse 90% 55% at 15% 0%, rgba(124,58,237,0.4) 0%, transparent 55%),
      radial-gradient(ellipse 70% 45% at 90% 90%, rgba(240,171,252,0.18) 0%, transparent 50%),
      linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 50%, #080210 100%);
    background-attachment: fixed;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.05rem, 3.8vw, 1.85rem);
    background: linear-gradient(120deg, #fff, var(--purple-bright), var(--purple), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 24px rgba(192,132,252,0.55)); margin-bottom: 8px;
  }
  .subtitle { color: var(--muted); font-size: 0.92rem; margin-bottom: 28px; font-weight: 600; }
  .layout { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; max-width: 1000px; width: 100%; }
  .panel {
    background: linear-gradient(155deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(28px) saturate(1.5); -webkit-backdrop-filter: blur(28px) saturate(1.5);
    border: 1px solid var(--glass-border); border-radius: 28px; padding: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 35%;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent);
    pointer-events: none; border-radius: 28px 28px 0 0;
  }
  .preview-panel { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 300px; }
  #stage {
    width: 300px; height: 300px; background: rgba(5,2,12,0.85); border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(192,132,252,0.22);
    box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 0 36px rgba(124,58,237,0.2);
  }
  #faceCanvas { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .controls-panel { flex: 1; min-width: 280px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  label.file-btn, button.action {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 18px; border-radius: 16px; font-weight: 800; font-size: 0.95rem;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.14);
    transition: transform 0.15s ease, filter 0.15s; font-family: inherit;
  }
  label.file-btn {
    background: linear-gradient(135deg, rgba(192,132,252,0.95), rgba(124,58,237,0.95));
    color: #1a0a2e; box-shadow: 0 6px 22px rgba(124,58,237,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  label.file-btn:hover { transform: translateY(-2px); }
  input[type="file"] { display: none; }
  .btn-row, .export-row { display: flex; gap: 10px; }
  #playBtn { background: linear-gradient(135deg, rgba(240,171,252,0.9), rgba(192,132,252,0.85)); color: #1a0a2e; flex: 1; }
  #playBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #stopBtn { background: rgba(255,255,255,0.08); color: var(--text); flex: 1; }
  #exportGifBtn { background: linear-gradient(135deg, rgba(251,146,60,0.85), rgba(234,88,12,0.8)); color: #fff; flex: 1; }
  #exportVidBtn { background: linear-gradient(135deg, rgba(96,165,250,0.85), rgba(59,130,246,0.8)); color: #fff; flex: 1; }
  #exportGifBtn:disabled, #exportVidBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.6px; color: var(--muted); margin-bottom: 8px; font-weight: 700; }
  .face-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px;
    max-height: 168px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.28);
    border-radius: 18px; border: 1px solid rgba(255,255,255,0.06);
  }
  .face-thumb {
    width: 54px; height: 54px; border-radius: 14px; cursor: pointer; border: 2px solid transparent;
    background: rgba(255,255,255,0.04); image-rendering: pixelated; object-fit: contain;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  }
  .face-thumb:hover { transform: scale(1.1); }
  .face-thumb.active { border-color: var(--purple); box-shadow: 0 0 16px rgba(192,132,252,0.55); }
  .slider-group label { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; gap: 8px; font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: var(--purple); }
  .num-input {
    width: 96px; background: rgba(0,0,0,0.35); border: 1px solid rgba(192,132,252,0.28);
    border-radius: 10px; color: var(--purple-bright); font-family: monospace; font-size: 0.85rem;
    font-weight: 700; padding: 5px 8px; text-align: right;
  }
  .num-input:focus { outline: none; border-color: var(--purple); }
  #status { font-size: 0.88rem; color: var(--muted); text-align: center; min-height: 1.3em; font-weight: 600; }
  .vis { width: 100%; height: 44px; background: rgba(0,0,0,0.4); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
  #visCanvas { width: 100%; height: 100%; display: block; }
  footer { margin-top: 28px; font-size: 0.72rem; color: var(--muted); opacity: 0.55; }
  .hint { font-size: 0.78rem; color: var(--muted); text-align: center; opacity: 0.8; }
  #progressBar { width: 100%; height: 6px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; display: none; }
  #progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--purple-deep), var(--purple), var(--pink)); border-radius: 4px; }
</style>
</head>
<body>
  <h1>guest.lol</h1>
  <p class="subtitle">Gorilla Tag Face Lipsync</p>
  <div class="layout">
    <div class="panel preview-panel">
      <div id="stage"><canvas id="faceCanvas" width="256" height="256"></canvas></div>
      <div class="vis"><canvas id="visCanvas"></canvas></div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <p id="status">Loading faces…</p>
      <p class="hint">Pixel-aligned mouths • eyes stay put</p>
    </div>
    <div class="panel controls-panel">
      <div>
        <div class="section-title">Face</div>
        <div class="face-grid" id="idleGrid"></div>
      </div>
      <label class="file-btn" for="audioInput">📁 Choose Audio / Video</label>
      <input type="file" id="audioInput" accept="audio/*,video/*,.mp4,.webm,.mov,.m4a,.ogg">
      <div class="btn-row">
        <button class="action" id="playBtn" disabled>▶ Play</button>
        <button class="action" id="stopBtn">⏹ Stop</button>
      </div>
      <div class="export-row">
        <button class="action" id="exportGifBtn" disabled>🖼 Export GIF</button>
        <button class="action" id="exportVidBtn" disabled>🎬 Export Video</button>
      </div>
      <div class="slider-group">
        <label><span>Sensitivity</span>
          <input type="number" id="sensNum" min="0.1" max="10" step="0.00001" value="1.5" class="num-input">
        </label>
        <input type="range" id="sens" min="0.1" max="10" step="0.01" value="1.5">
      </div>
      <div class="slider-group">
        <label><span>Smoothing</span>
          <input type="number" id="smoothNum" min="0" max="0.95" step="0.00001" value="0.4" class="num-input">
        </label>
        <input type="range" id="smooth" min="0" max="0.95" step="0.01" value="0.4">
      </div>
      <div class="slider-group">
        <label><span>GIF FPS</span>
          <input type="number" id="fpsNum" min="1" max="30" step="1" value="12" class="num-input">
        </label>
        <input type="range" id="gifFps" min="1" max="30" step="1" value="12">
      </div>
    </div>
  </div>
  <footer>guest.lol</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script src="d0.js"></script>
<script src="d1.js"></script>
<script src="d2.js"></script>
<script src="d3.js"></script>
<script src="d4.js"></script>
<script src="d5.js"></script>
<script src="app-boot.js"></script>
</body>
</html>
