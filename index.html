<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guest.lol — Gorilla Tag Lipsync</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap');
  :root {
    --bg1: #1a0a2e; --bg3: #0d0618;
    --glass-border: rgba(255, 255, 255, 0.14);
    --glass-highlight: rgba(255, 255, 255, 0.2);
    --purple: #c084fc; --purple-bright: #e9d5ff; --purple-deep: #7c3aed;
    --pink: #f0abfc; --text: #f5eefc; --muted: #b8a0d4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif; color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 20px 16px;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124, 58, 237, 0.35) 0%, transparent 50%),
      radial-gradient(ellipse 70% 50% at 85% 80%, rgba(192, 132, 252, 0.2) 0%, transparent 45%),
      linear-gradient(165deg, var(--bg1) 0%, var(--bg3) 40%, #12081f 100%);
    background-attachment: fixed;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1rem, 3.5vw, 1.7rem);
    background: linear-gradient(135deg, var(--purple-bright), var(--purple), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.5)); margin-bottom: 6px;
  }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; opacity: 0.85; }
  .layout { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; max-width: 980px; width: 100%; }
  .panel {
    background: linear-gradient(145deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.03) 100%);
    backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--glass-border); border-radius: 24px; padding: 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 var(--glass-highlight);
  }
  .preview-panel { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 300px; }
  #stage { width: min(100%, 360px); aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: #000; }
  #faceCanvas { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  .controls-panel { flex: 1; min-width: 280px; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
  label.file-btn, button.action {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 18px; border-radius: 14px; font-weight: 800; font-size: 0.95rem;
    cursor: pointer; border: none; font-family: inherit; color: #fff;
  }
  label.file-btn { background: linear-gradient(135deg, #c084fc, #7c3aed); }
  input[type="file"] { display: none; }
  .btn-row, .export-row { display: flex; gap: 10px; }
  #playBtn { background: linear-gradient(135deg, #f0abfc, #c084fc); color: #1e1b2e; flex: 1; }
  #playBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #stopBtn { background: rgba(255,255,255,0.08); color: var(--text); flex: 1; border: 1px solid var(--glass-border); }
  #exportVidBtn { background: linear-gradient(135deg, #60a5fa, #3b82f6); flex: 1; }
  #exportVidBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .section-title { font-weight: 800; font-size: 0.85rem; color: var(--purple-bright); margin-bottom: 6px; }
  .face-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; max-height: 180px; overflow-y: auto; padding: 8px; background: rgba(0,0,0,0.25); border-radius: 16px; border: 1px solid var(--glass-border); }
  .face-grid .face-thumb { border: 2px solid transparent; border-radius: 12px; background: rgba(0,0,0,0.3); cursor: pointer; padding: 4px; width: 100%; }
  .face-grid .face-thumb.active { border-color: var(--purple); }
  .face-grid img { width: 100%; height: auto; image-rendering: pixelated; display: block; border-radius: 8px; }
  .slider-group { display: flex; flex-direction: column; gap: 4px; }
  .slider-group label { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  .num-input { width: 64px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: var(--text); font-size: 0.8rem; }
  input[type="range"] { width: 100%; accent-color: var(--purple); }
  #status { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; text-align: center; max-width: 360px; }
  .hint { font-size: 0.75rem; color: var(--muted); opacity: 0.85; text-align: center; }
  .vis { width: min(100%, 360px); height: 40px; border-radius: 10px; overflow: hidden; background: #0a0a0a; }
  #visCanvas { width: 100%; height: 100%; }
  #progressBar { width: min(100%, 360px); height: 6px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; display: none; }
  #progressFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--purple-deep), var(--pink)); }
  footer { margin-top: 24px; font-size: 0.72rem; color: var(--muted); opacity: 0.7; }
</style>
</head>
<body>
  <h1>guest.lol</h1>
  <p class="subtitle">Gorilla Tag Face Lipsync</p>
  <div class="layout">
    <div class="panel preview-panel">
      <div id="stage"><canvas id="faceCanvas" width="512" height="512"></canvas></div>
      <div class="vis"><canvas id="visCanvas" width="320" height="40"></canvas></div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <p id="status">Loading Gorilla Tag faces…</p>
      <p class="hint">Clean faces only • mouth stays below the eyes</p>
    </div>
    <div class="panel controls-panel">
      <div>
        <div class="section-title">Face</div>
        <div class="face-grid" id="idleGrid"></div>
      </div>
      <label class="file-btn" for="audioInput">📁 Choose Audio / Video</label>
      <input type="file" id="audioInput" accept="audio/*,video/*,.mp4,.webm,.mov,.m4a,.ogg">
      <div class="btn-row">
        <button class="action" id="playBtn" disabled>▶ Play</button>
        <button class="action" id="stopBtn">⏹ Stop</button>
      </div>
      <div class="export-row">
        <button class="action" id="exportVidBtn" disabled>🎬 Export MP4</button>
      </div>
      <div class="slider-group">
        <label><span>Sensitivity</span>
          <input type="number" id="sensNum" min="0.1" max="10" step="0.00001" value="1.5" class="num-input">
        </label>
        <input type="range" id="sens" min="0.1" max="10" step="0.01" value="1.5">
      </div>
      <div class="slider-group">
        <label><span>Smoothing</span>
          <input type="number" id="smoothNum" min="0" max="0.95" step="0.00001" value="0.4" class="num-input">
        </label>
        <input type="range" id="smooth" min="0" max="0.95" step="0.01" value="0.4">
      </div>
    </div>
  </div>
  <footer>guest.lol</footer>
<script src="boot.js?v=gt2"></script>
</body>
</html>
