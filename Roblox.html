<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guest.lol — Zip Faces Lipsync</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap');
  :root {
    --bg1: #050505;
    --bg2: #0b0b0b;
    --bg3: #151515;
    --glass: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.12);
    --glass-highlight: rgba(255,255,255,0.08);
    --purple: #ffffff;
    --purple-bright: #d8d8d8;
    --purple-deep: #eeeeee;
    --pink: #8a8a8a;
    --text: #f4f4f4;
    --muted: #8d8d8d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    background: #050505;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1rem, 3.5vw, 1.7rem);
    background: linear-gradient(135deg, var(--purple-deep), var(--purple), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 8px rgba(124, 58, 237, 0.25));
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 22px;
    opacity: 0.9;
  }
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    justify-content: center;
    max-width: 980px;
    width: 100%;
  }
  .panel {
    background: #050505;
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 18px;
    box-shadow:
      0 8px 28px rgba(124, 58, 237, 0.12),
      0 2px 8px rgba(0, 0, 0, 0.04);
    position: relative;
    overflow: hidden;
  }
  .panel::before { display: none; }
  .preview-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    min-width: 280px;
  }
  #stage {
    width: 280px;
    height: 280px;
    background: #090909;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow:
      inset 0 0 20px rgba(124, 58, 237, 0.06),
      0 4px 16px rgba(124, 58, 237, 0.1);
  }
  #faceCanvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .controls-panel {
    flex: 1;
    min-width: 280px;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label.file-btn, button.action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 18px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    font-family: inherit;
  }
  label.file-btn {
    background: #f2f2f2;
    color: #080808;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
  }
  label.file-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(124, 58, 237, 0.4);
  }
  input[type="file"] { display: none; }
  .btn-row, .export-row { display: flex; gap: 10px; }
  #playBtn {
    background: #dedede;
    color: #f4f4f4;
    flex: 1;
    box-shadow: 0 4px 14px rgba(192, 132, 252, 0.3);
  }
  #playBtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  #playBtn:not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.05); }
  #stopBtn {
    background: #090909;
    color: var(--text);
    flex: 1;
    border: 1px solid rgba(255,255,255,0.12);
  }
  #stopBtn:hover { background: #1c1c1c; }
  #exportGifBtn {
    background: #292929;
    color: white;
    flex: 1;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
  }
  #exportVidBtn {
    background: #292929;
    color: white;
    flex: 1;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
  }
  #exportGifBtn:disabled, #exportVidBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #exportGifBtn:not(:disabled):hover, #exportVidBtn:not(:disabled):hover {
    transform: translateY(-1px); filter: brightness(1.1);
  }
  .section-title {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 8px;
    opacity: 0.8;
  }
  .face-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
    padding: 8px;
    background: #101010;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .face-thumb {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    background: #050505;
    image-rendering: pixelated;
    object-fit: contain;
    transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
  }
  .face-thumb:hover { transform: scale(1.1); }
  .face-thumb.active {
    border-color: var(--purple);
    box-shadow: 0 0 12px rgba(124, 58, 237, 0.35);
  }
  .slider-group label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 5px;
    gap: 8px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--purple);
    height: 6px;
  }
  .num-input {
    width: 96px;
    background: #101010;
    border: 1px solid rgba(124, 58, 237, 0.25);
    border-radius: 10px;
    color: #f4f4f4;
    font-family: 'Nunito', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 4px 8px;
    text-align: right;
  }
  .num-input:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 8px rgba(124, 58, 237, 0.25);
  }
  #status {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.2em;
  }
  .vis {
    width: 100%;
    height: 42px;
    background: #090909;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #visCanvas { width: 100%; height: 100%; display: block; }
  footer {
    margin-top: 24px;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.7;
  }
  .hint {
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.4;
    text-align: center;
    opacity: 0.85;
  }
  .face-grid::-webkit-scrollbar { width: 6px; }
  .face-grid::-webkit-scrollbar-thumb {
    background: rgba(124, 58, 237, 0.3);
    border-radius: 3px;
  }
  #progressBar {
    width: 100%;
    height: 6px;
    background: #242424;
    border-radius: 4px;
    overflow: hidden;
    display: none;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: #f0f0f0;
    transition: width 0.1s;
    border-radius: 4px;
  }
  .search-box {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.14);
    background: #101010;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
  }
  .search-box:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 8px rgba(124, 58, 237, 0.2);
  }
  .search-box::placeholder { color: var(--muted); }

  /* Minimal black-and-white look inspired by the reference clip */
  body { background: #000; color: #f5f5f5; }
  .panel { background: #080808; border-color: #202020; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
  #stage { background: #000; border-color: #171717; box-shadow: none; }
  .face-grid { background: #0b0b0b; border-color: #202020; }
  .face-thumb { background: #000; }
  .search-box, .num-input { background: #111; color: #f5f5f5; border-color: #292929; }
  .vis { background: #090909; border-color: #202020; }
  #stopBtn { background: #171717; color: #eee; border-color: #292929; }
  #stopBtn:hover { background: #242424; }
  #playBtn { color: #050505; }
  #exportGifBtn, #exportVidBtn { color: #f5f5f5; }
  footer { color: #777; }
</style>
</head>
<body>
  <h1>guest.lol</h1>
  <p class="subtitle">Separated eyes + mouths · black & white face animation</p>
  <div class="layout">
    <div class="panel preview-panel">
      <div id="stage"><canvas id="faceCanvas" width="256" height="256"></canvas></div>
      <div class="vis"><canvas id="visCanvas"></canvas></div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <p id="status">Choose a face and load audio</p>
      <p class="hint">Minimal face · mouth reacts to audio</p>
    </div>
    <div class="panel controls-panel">
      <div>
        <div class="section-title">Eyes <span id="faceCount"></span></div>
        <input type="text" class="search-box" id="faceSearch" placeholder="Search eyes...">
        <div class="face-grid" id="idleGrid" style="margin-top:8px;"></div>
      </div>
      <label class="file-btn" for="audioInput">📁 Choose Audio / Video</label>
      <input type="file" id="audioInput" accept="audio/*,video/*,.mp4,.webm,.mov,.m4a,.ogg">
      <div class="btn-row">
        <button class="action" id="playBtn" disabled>▶ Play</button>
        <button class="action" id="stopBtn">⏹ Stop</button>
      </div>
      <div class="export-row">
        <button class="action" id="exportGifBtn" disabled>🖼 Export GIF</button>
        <button class="action" id="exportVidBtn" disabled>🎬 Export Video</button>
      </div>
      <div class="slider-group">
        <label><span>Sensitivity</span>
          <input type="number" id="sensNum" min="0.1" max="10" step="0.00001" value="1.5" class="num-input">
        </label>
        <input type="range" id="sens" min="0.1" max="10" step="0.01" value="1.5">
      </div>
      <div class="slider-group">
        <label><span>Smoothing</span>
          <input type="number" id="smoothNum" min="0" max="0.95" step="0.00001" value="0.2" class="num-input">
        </label>
        <input type="range" id="smooth" min="0" max="0.95" step="0.01" value="0.2">
      </div>
      <div class="slider-group">
        <label><span>Mouth Size</span>
          <input type="number" id="mouthNum" min="0.3" max="2" step="0.01" value="1" class="num-input">
        </label>
        <input type="range" id="mouthSize" min="0.3" max="2" step="0.01" value="1">
      </div>
      <div class="slider-group">
        <label><span>GIF FPS</span>
          <input type="number" id="fpsNum" min="1" max="30" step="1" value="12" class="num-input">
        </label>
        <input type="range" id="gifFps" min="1" max="30" step="1" value="12">
      </div>
    </div>
  </div>
  <footer>guest.lol · minimal face animation</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="face_list.js"></script>
<script src="mouths-data.js"></script>
<script src="app.js"></script>
</body>
</html>
