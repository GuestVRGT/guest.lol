<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guest.lol — Zip Faces Lipsync</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap');
  :root {
    --purple: #7c3aed;
    --purple-deep: #5b21b6;
    --pink: #d946ef;
    --text: #1e1b2e;
    --muted: #6b5b8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    background: #ffffff;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1rem, 3.5vw, 1.7rem);
    background: linear-gradient(135deg, var(--purple-deep), var(--purple), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }
  .layout { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; max-width: 980px; width: 100%; }
  .panel {
    background: #ffffff;
    border: 1px solid rgba(124, 58, 237, 0.18);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 8px 28px rgba(124, 58, 237, 0.12);
  }
  .preview-panel { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 280px; }
  #stage {
    width: 280px; height: 280px;
    border-radius: 20px; overflow: hidden;
    border: 1px solid #222;
    background-color: #000000;
    background-image: none;
  }
  #faceCanvas { width: 100%; height: 100%; image-rendering: pixelated; }
  .controls-panel { flex: 1; min-width: 280px; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
  label.file-btn, button.action {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 18px; border-radius: 14px; font-weight: 800; font-size: 0.95rem;
    cursor: pointer; border: none; font-family: inherit;
  }
  label.file-btn { background: linear-gradient(135deg, #c084fc, #7c3aed); color: #fff; }
  input[type="file"] { display: none; }
  .btn-row, .export-row { display: flex; gap: 10px; }
  #playBtn { background: linear-gradient(135deg, #f0abfc, #c084fc); color: #1e1b2e; flex: 1; }
  #playBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #stopBtn { background: #f3f0fa; color: var(--text); flex: 1; border: 1px solid rgba(124,58,237,0.15); }
  #exportGifBtn { background: linear-gradient(135deg, #fb923c, #ea580c); color: white; flex: 1; }
  #exportVidBtn { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: white; flex: 1; }
  #exportGifBtn:disabled, #exportVidBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 8px; }
  .face-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px; max-height: 180px; overflow-y: auto; padding: 8px;
    background: #f8f5ff; border-radius: 16px; border: 1px solid rgba(124,58,237,0.12);
  }
  .face-thumb {
    width: 52px; height: 52px; border-radius: 12px; cursor: pointer;
    border: 2px solid transparent; background: #fff; image-rendering: pixelated; object-fit: contain;
  }
  .face-thumb.active { border-color: var(--purple); box-shadow: 0 0 12px rgba(124,58,237,0.35); }
  .mouth-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .mouth-thumb {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px; border-radius: 12px; border: 2px solid transparent;
    background: #f8f5ff; cursor: pointer; font-family: inherit; font-size: 0.7rem; color: var(--muted);
  }
  .mouth-thumb img {
    width: 40px; height: 40px; image-rendering: pixelated; object-fit: contain;
    background: #111; border-radius: 8px;
  }
  .mouth-thumb.active { border-color: var(--purple); box-shadow: 0 0 10px rgba(124,58,237,0.3); }
  .slider-group label { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; }
  input[type="range"] { width: 100%; accent-color: var(--purple); }
  .num-input {
    width: 96px; background: #f8f5ff; border: 1px solid rgba(124,58,237,0.25);
    border-radius: 10px; color: var(--purple-deep); font-weight: 700; padding: 4px 8px; text-align: right;
  }
  #status { font-size: 0.85rem; color: var(--muted); text-align: center; min-height: 1.2em; }
  .vis { width: 100%; height: 42px; background: #f3f0fa; border-radius: 12px; overflow: hidden; }
  #visCanvas { width: 100%; height: 100%; display: block; }
  .hint { font-size: 0.78rem; color: var(--muted); text-align: center; }
  #progressBar { width: 100%; height: 6px; background: #e8e2f5; border-radius: 4px; overflow: hidden; display: none; }
  #progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--purple-deep), var(--purple), var(--pink)); }
  .search-box {
    width: 100%; padding: 10px 14px; border-radius: 12px;
    border: 1px solid rgba(124,58,237,0.2); background: #f8f5ff; color: var(--text); font-family: inherit;
  }
  footer { margin-top: 24px; font-size: 0.72rem; color: var(--muted); opacity: 0.7; }
</style>
</head>
<body>
  <h1>guest.lol</h1>
  <p class="subtitle">pablobloxx style · black + white</p>
  <div class="layout">
    <div class="panel preview-panel">
      <div id="stage"><canvas id="faceCanvas" width="256" height="256"></canvas></div>
      <div class="vis"><canvas id="visCanvas"></canvas></div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <p id="status">Pick eyes & load audio!</p>
      <p class="hint">Black bg · white dots · closed line when quiet · O when talking</p>
    </div>
    <div class="panel controls-panel">
      <div>
        <div class="section-title">Eyes <span id="faceCount"></span></div>
        <input type="text" class="search-box" id="faceSearch" placeholder="Search eyes...">
        <div class="face-grid" id="idleGrid" style="margin-top:8px;"></div>
      </div>
      <div>
        <div class="section-title">Mouth style</div>
        <div class="mouth-grid" id="mouthGrid"></div>
      </div>
      <label class="file-btn" for="audioInput">Choose Audio / Video</label>
      <input type="file" id="audioInput" accept="audio/*,video/*,.mp4,.webm,.mov,.m4a,.ogg">
      <div class="btn-row">
        <button class="action" id="playBtn" disabled>Play</button>
        <button class="action" id="stopBtn">Stop</button>
      </div>
      <div class="export-row">
        <button class="action" id="exportGifBtn" disabled>Export GIF</button>
        <button class="action" id="exportVidBtn" disabled>Export Video</button>
      </div>
      <div class="slider-group">
        <label><span>Sensitivity</span>
          <input type="number" id="sensNum" min="0.1" max="10" step="0.01" value="1.5" class="num-input">
        </label>
        <input type="range" id="sens" min="0.1" max="10" step="0.01" value="1.5">
      </div>
      <div class="slider-group">
        <label><span>Smoothing</span>
          <input type="number" id="smoothNum" min="0" max="0.95" step="0.01" value="0.2" class="num-input">
        </label>
        <input type="range" id="smooth" min="0" max="0.95" step="0.01" value="0.2">
      </div>
      <div class="slider-group">
        <label><span>GIF FPS</span>
          <input type="number" id="fpsNum" min="1" max="30" step="1" value="12" class="num-input">
        </label>
        <input type="range" id="gifFps" min="1" max="30" step="1" value="12">
      </div>
    </div>
  </div>
  <footer>guest.lol</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="face_list.js?v=pablo1"></script>
<script src="mouths-data.js?v=pablo1"></script>
<script src="app.js?v=pablo1"></script>
</body>
</html>
